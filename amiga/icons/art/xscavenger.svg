<?xml version="1.0" encoding="UTF-8"?>
<!-- XScavenger's GlowIcon art: a little runner on brick floors beside a
     ladder, a gold chest and a dug hole. The AmiCradle Team's own drawing. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="brick" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e06040"/>
      <stop offset="1" stop-color="#8a2a18"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff080"/>
      <stop offset="1" stop-color="#c08a10"/>
    </linearGradient>
  </defs>
  <!-- ladder -->
  <g stroke="#e8e0c0" stroke-width="4" stroke-linecap="round">
    <path d="M86 20 V96 M106 20 V96"/>
    <path d="M86 32 H106 M86 48 H106 M86 64 H106 M86 80 H106"/>
  </g>
  <!-- floors of brick -->
  <g fill="url(#brick)" stroke="#40140a" stroke-width="2">
    <rect x="4" y="96" width="120" height="14"/>
    <rect x="4" y="110" width="120" height="14"/>
    <rect x="4" y="44" width="76" height="12"/>
  </g>
  <path d="M24 96 V110 M48 96 V110 M72 96 V110 M96 96 V110 M12 110 V124 M36 110 V124 M60 110 V124 M84 110 V124 M108 110 V124 M28 44 V56 M56 44 V56" stroke="#40140a" stroke-width="1.5"/>
  <!-- dug hole -->
  <rect x="50" y="97" width="20" height="12" fill="#1a0a06"/>
  <!-- gold chest on the upper floor -->
  <rect x="14" y="28" width="22" height="16" rx="2" fill="url(#gold)" stroke="#5a3a00" stroke-width="2"/>
  <path d="M14 34 H36" stroke="#5a3a00" stroke-width="2"/>
  <circle cx="25" cy="38" r="2" fill="#5a3a00"/>
  <!-- runner -->
  <g stroke="#20305a" stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M30 70 L26 84 L18 94"/>
    <path d="M26 84 L36 94"/>
    <path d="M30 72 L20 78 M30 72 L40 66"/>
  </g>
  <circle cx="32" cy="63" r="6" fill="#f0c8a0" stroke="#20305a" stroke-width="2"/>
  <path d="M30 70 L26 84" stroke="#3a7aff" stroke-width="7" stroke-linecap="round"/>
</svg>
